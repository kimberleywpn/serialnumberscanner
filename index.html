<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#101a16" />
  <meta name="description" content="Scan and collect serial text printed below QR codes." />
  <title>Label Lens — Mobile label OCR</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23101a16'/%3E%3Cpath d='M15 15h13v13H15zm21 0h13v13H36zM15 36h13v13H15z' fill='none' stroke='%238ee6a8' stroke-width='5'/%3E%3Cpath d='M37 37h5v5h-5zm8 0h5v13h-5zm-8 8h5v5h-5z' fill='%23fff'/%3E%3C/svg%3E" />
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    :root{--ink:#101a16;--paper:#f3f7f3;--card:#fff;--muted:#64716a;--line:#dce5dd;--mint:#8ee6a8;--mint-dark:#145d31;--orange:#ffb45e;--danger:#a63d35;--shadow:0 18px 45px rgba(16,26,22,.11)}
    *{box-sizing:border-box}html{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--paper);color:var(--ink)}body{margin:0;min-height:100vh;background:radial-gradient(circle at 10% 0,rgba(142,230,168,.19),transparent 25rem),var(--paper)}button,input{font:inherit}button{cursor:pointer}.shell{max-width:1080px;margin:auto;padding:0 12px calc(92px + env(safe-area-inset-bottom))}
    .topbar{height:58px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;background:rgba(243,247,243,.88);backdrop-filter:blur(14px)}.brand{display:flex;align-items:center;gap:9px;font-weight:850;letter-spacing:-.02em}.brandmark{width:32px;height:32px;border-radius:9px;background:var(--ink);display:grid;place-items:center}.brandmark svg{width:19px}.privacy{font-size:.76rem;color:var(--muted);display:flex;align-items:center;gap:6px}.privacy:before{content:"";width:7px;height:7px;border-radius:50%;background:#25a954}
    .intro{padding:19px 3px 16px}.eyebrow{font-size:.72rem;font-weight:850;letter-spacing:.13em;text-transform:uppercase;color:var(--mint-dark);margin-bottom:7px}.intro h1{font-size:clamp(1.75rem,8vw,3.25rem);line-height:1;letter-spacing:-.05em;margin:0 0 9px}.intro p{font-size:.95rem;line-height:1.5;color:var(--muted);margin:0;max-width:560px}
    .grid{display:grid;gap:14px}.panel{background:var(--card);border:1px solid rgba(16,26,22,.08);border-radius:18px;box-shadow:var(--shadow)}.viewer{padding:9px}.stage{position:relative;height:min(53vh,500px);min-height:330px;border-radius:12px;overflow:hidden;background:#101713;display:flex;align-items:center;justify-content:center}.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#e6eee9;padding:28px;background:linear-gradient(135deg,#101a16,#293a30)}.empty-icon{width:54px;height:54px;border:1px solid rgba(255,255,255,.25);border-radius:16px;margin:0 auto 15px;display:grid;place-items:center}.empty strong{font-size:1rem}.empty p{margin:5px 0 0;color:#9bac9f;font-size:.83rem}.canvas-wrap{position:relative;display:none;max-width:100%;max-height:100%;line-height:0}.canvas-wrap canvas{display:block;max-width:100%;max-height:min(53vh,500px)}
    .scanbox{position:absolute;border:3px solid var(--orange);background:rgba(255,180,94,.08);box-shadow:0 0 0 9999px rgba(2,7,4,.5);cursor:move;touch-action:none;min-width:58px;min-height:38px}.scanbox:before,.scanbox:after{content:"";position:absolute;width:18px;height:18px;border-color:#fff}.scanbox:before{left:-3px;top:-3px;border-left:3px solid #fff;border-top:3px solid #fff}.scanbox:after{right:-3px;bottom:-3px;border-right:3px solid #fff;border-bottom:3px solid #fff}.handle{position:absolute;width:28px;height:28px;right:-15px;bottom:-15px;border-radius:50%;background:#fff;border:7px solid var(--orange);cursor:nwse-resize;z-index:2}.crop-label{position:absolute;top:-28px;left:-3px;background:var(--orange);color:#402400;font-size:.66rem;line-height:1;padding:8px 9px;font-weight:900;letter-spacing:.07em;border-radius:6px 6px 0 0}
    .toolbar{display:grid;grid-template-columns:1fr auto auto;gap:8px;padding-top:9px}.btn{border:0;border-radius:11px;padding:10px 12px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px}.btn-main{background:var(--ink);color:#fff}.btn-soft{background:#edf2ee;color:var(--ink);min-width:52px}.btn:focus-visible,.scan:focus-visible,.mini:focus-visible{outline:3px solid rgba(20,93,49,.28);outline-offset:2px}.btn:disabled{opacity:.4;cursor:not-allowed}.file{position:relative;overflow:hidden}.file input{position:absolute;inset:0;opacity:0;cursor:pointer}.rotate-word{display:none}
    .action{padding:14px;position:sticky;bottom:calc(8px + env(safe-area-inset-bottom));z-index:15}.scan{width:100%;min-height:54px;border:0;border-radius:13px;background:var(--mint);color:#10391d;font-weight:900;font-size:1rem}.scan:disabled{opacity:.45;cursor:not-allowed}.progress{display:none;margin-top:12px}.progress-head{display:flex;justify-content:space-between;color:var(--muted);font-size:.78rem;margin-bottom:6px}.track{height:7px;background:#e9eee9;border-radius:99px;overflow:hidden}.bar{height:100%;width:0;background:var(--mint-dark);transition:width .2s}.last{display:none;margin-top:11px;padding:12px;border:1px solid var(--line);border-radius:11px;background:#f4f7f4}.last-label{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:850}.last-code{font:850 1.18rem/1.25 ui-monospace,SFMono-Regular,Consolas,monospace;margin-top:5px;overflow-wrap:anywhere}
    .history{margin-top:14px;padding:16px}.history-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:13px}.history-title{display:flex;align-items:center;gap:8px}.history h2{margin:0;font-size:1.1rem;letter-spacing:-.025em}.count{min-width:25px;height:25px;padding:0 7px;border-radius:99px;background:#e9f6ed;color:var(--mint-dark);font-size:.75rem;font-weight:900;display:grid;place-items:center}.history-actions{display:flex;gap:5px}.mini{border:0;border-radius:8px;padding:8px 9px;background:#eef3ef;color:var(--ink);font-weight:800;font-size:.76rem}.mini:disabled{opacity:.4;cursor:not-allowed}.mini.clear{color:var(--danger)}.empty-list{text-align:center;padding:24px 12px;color:var(--muted);font-size:.88rem;border:1px dashed var(--line);border-radius:12px}.results{display:grid;gap:8px}.result-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;padding:11px 10px;border:1px solid var(--line);border-radius:12px;background:#fbfcfb}.number{width:28px;height:28px;border-radius:8px;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:.74rem;font-weight:850}.result-code{font:800 1rem/1.3 ui-monospace,SFMono-Regular,Consolas,monospace;overflow-wrap:anywhere}.result-time{font-size:.7rem;color:var(--muted);margin-top:2px}.copy-one{border:0;border-radius:9px;background:#e5f7eb;color:var(--mint-dark);font-weight:850;padding:9px 10px}.toast{position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom));transform:translate(-50%,16px);opacity:0;background:var(--ink);color:#fff;padding:11px 15px;border-radius:10px;font-weight:750;font-size:.82rem;transition:.2s;z-index:30;pointer-events:none;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(min-width:760px){.shell{padding:0 24px 54px}.topbar{position:static;height:66px}.intro{padding:32px 3px 22px}.grid{grid-template-columns:minmax(0,1.45fr) minmax(290px,.68fr);align-items:start}.action{position:sticky;top:20px;bottom:auto;padding:20px}.stage{height:510px}.canvas-wrap canvas{max-height:510px}.history{grid-column:1/-1;padding:20px}.rotate-word{display:inline}.toolbar{grid-template-columns:auto auto auto 1fr}.file{min-width:160px}.toast{bottom:24px}.results{grid-template-columns:repeat(2,minmax(0,1fr))}}
    .toolbar{grid-template-columns:1fr 1fr 48px 48px}.btn{padding:10px 8px}.btn-soft{min-width:44px}.mini,.copy-one{min-height:44px;font-size:.875rem}.intro p{font-size:1rem}.empty p,.empty-list{font-size:.875rem}.scanbox{min-height:18px}.handle:before{content:'';position:absolute;inset:-12px;border-radius:50%;touch-action:none}.history-head{flex-wrap:wrap}.last-label{font-size:.8125rem}.result-time{font-size:.8125rem}
    @media(min-width:760px){.toolbar{grid-template-columns:1fr 1fr auto auto}.file{min-width:0}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar"><div class="brand"><span class="brandmark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M3 3h7v7H3V3Zm11 0h7v7h-7V3ZM3 14h7v7H3v-7Z" stroke="#8ee6a8" stroke-width="2"/><path d="M15 15h2v2h-2zm4 0h2v6h-2zm-4 4h2v2h-2z" fill="white"/></svg></span>Label Lens</div><div class="privacy">On-device</div></header>
    <section class="intro"><div class="eyebrow">Mobile label scanner</div><h1>Scan. Save. Copy.</h1><p>Place the orange box over the serial text below one QR code.</p></section>
    <section class="grid">
      <div class="panel viewer">
        <div class="stage" id="stage">
          <div class="empty" id="empty"><div><div class="empty-icon"><svg width="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 7h3l1.5-2h7L17 7h3v12H4z"/><circle cx="12" cy="13" r="3.5"/></svg></div><strong>Take or choose a photo</strong><p>Use a close, glare-free image</p></div></div>
          <div class="canvas-wrap" id="wrap"><canvas id="canvas"></canvas><div class="scanbox" id="box" role="region" aria-label="OCR crop area"><span class="crop-label">OCR AREA</span><span class="handle" id="handle" aria-hidden="true"></span></div></div>
        </div>
        <div class="toolbar">
          <label class="btn btn-main file">Take photo<input id="file" type="file" accept="image/*" capture="environment" /></label>
          <label class="btn btn-soft file">Upload<input id="upload" type="file" accept="image/*" /></label>
          <button class="btn btn-soft" id="left" disabled aria-label="Rotate image left">↶ <span class="rotate-word">Left</span></button>
          <button class="btn btn-soft" id="right" disabled aria-label="Rotate image right">↷ <span class="rotate-word">Right</span></button>
        </div>
      </div>
      <aside class="panel action">
        <button class="scan" id="scan" disabled>Scan text</button>
        <div class="progress" id="progress"><div class="progress-head"><span id="status">Preparing…</span><span id="pct">0%</span></div><div class="track"><div class="bar" id="bar"></div></div></div>
        <div class="last" id="last"><div class="last-label">Added to list</div><div class="last-code" id="lastCode"></div></div>
      </aside>
      <section class="panel history">
        <div class="history-head"><div class="history-title"><h2>Scanned text</h2><span class="count" id="count">0</span></div><div class="history-actions"><button class="mini" id="copyAll" disabled>Copy all</button><button class="mini clear" id="clearAll" disabled>Clear</button></div></div>
        <div class="empty-list" id="emptyList">Scanned codes will appear here.</div><div class="results" id="results"></div>
      </section>
    </section>
  </main><div class="toast" id="toast">Copied</div>
  <script>
    const $=s=>document.querySelector(s),file=$('#file'),canvas=$('#canvas'),ctx=canvas.getContext('2d'),wrap=$('#wrap'),box=$('#box');
    let source=null,rotation=0,drag=null,resize=false,items=[];
    try{items=JSON.parse(localStorage.getItem('labelLensScans')||'[]');if(!Array.isArray(items))items=[];items=items.filter(x=>x&&typeof x.code==='string'&&typeof x.time==='string')}catch{}
    function toast(text){$('#toast').textContent=text;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),1400)}
    function save(){try{localStorage.setItem('labelLensScans',JSON.stringify(items))}catch{}renderList()}
    function escapeHtml(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
    function renderList(){const list=$('#results');$('#count').textContent=items.length;$('#emptyList').style.display=items.length?'none':'block';$('#copyAll').disabled=$('#clearAll').disabled=!items.length;list.innerHTML=items.map((x,i)=>`<article class="result-row"><span class="number">${i+1}</span><div><div class="result-code">${escapeHtml(x.code)}</div><div class="result-time">${escapeHtml(x.time)}</div></div><button class="copy-one" data-i="${i}">Copy</button></article>`).join('')}
    renderList();
    async function copyText(text,message){try{await navigator.clipboard.writeText(text);toast(message)}catch{const field=document.createElement('textarea');field.value=text;field.style.cssText='position:fixed;left:0;top:0;width:1px;height:1px;opacity:0';document.body.append(field);field.select();const copied=document.execCommand('copy');field.remove();toast(copied?message:'Copy unavailable — select the code and hold to copy')}}
    $('#results').onclick=e=>{const b=e.target.closest('[data-i]');if(!b)return;copyText(items[+b.dataset.i].code,'Code copied')};
    $('#copyAll').onclick=()=>copyText(items.map(x=>x.code).join('\n'),`${items.length} code${items.length===1?'':'s'} copied`);
    $('#clearAll').onclick=()=>{if(!items.length||!confirm('Clear all scanned codes from this device?'))return;items=[];save();$('#last').style.display='none';toast('List cleared')};
    function render(){if(!source)return;const r=((rotation%360)+360)%360,swap=r===90||r===270;canvas.width=swap?source.height:source.width;canvas.height=swap?source.width:source.height;ctx.save();ctx.translate(canvas.width/2,canvas.height/2);ctx.rotate(rotation*Math.PI/180);ctx.drawImage(source,-source.width/2,-source.height/2);ctx.restore();wrap.style.display='block';$('#empty').style.display='none';requestAnimationFrame(placeDefault)}
    function placeDefault(){const w=wrap.clientWidth,h=wrap.clientHeight;box.style.left=w*.14+'px';box.style.top=h*.65+'px';box.style.width=w*.7+'px';box.style.height=Math.max(48,h*.14)+'px'}
    function loadPhoto(e){const f=e.target.files[0];if(!f)return;const img=new Image(),url=URL.createObjectURL(f);img.onload=()=>{source=img;rotation=0;render();$('#scan').disabled=false;$('#left').disabled=$('#right').disabled=false;$('#last').style.display='none';URL.revokeObjectURL(url);e.target.value=''};img.onerror=()=>{URL.revokeObjectURL(url);toast('Choose a supported image, such as JPG or PNG')};img.src=url}
    file.onchange=$('#upload').onchange=loadPhoto;
    $('#left').onclick=()=>{rotation-=90;render()};$('#right').onclick=()=>{rotation+=90;render()};
    function point(e){const r=wrap.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
    box.addEventListener('pointerdown',e=>{if(e.target.id==='handle')return;drag={...point(e),left:box.offsetLeft,top:box.offsetTop};box.setPointerCapture(e.pointerId)});
    box.addEventListener('pointermove',e=>{if(!drag)return;const p=point(e),x=Math.max(0,Math.min(wrap.clientWidth-box.offsetWidth,drag.left+p.x-drag.x)),y=Math.max(0,Math.min(wrap.clientHeight-box.offsetHeight,drag.top+p.y-drag.y));box.style.left=x+'px';box.style.top=y+'px'});box.addEventListener('pointerup',()=>drag=null);box.addEventListener('pointercancel',()=>drag=null);
    $('#handle').addEventListener('pointerdown',e=>{e.stopPropagation();resize={...point(e),w:box.offsetWidth,h:box.offsetHeight};e.target.setPointerCapture(e.pointerId)});$('#handle').addEventListener('pointermove',e=>{if(!resize)return;const p=point(e);box.style.width=Math.max(58,Math.min(wrap.clientWidth-box.offsetLeft,resize.w+p.x-resize.x))+'px';box.style.height=Math.max(18,Math.min(wrap.clientHeight-box.offsetTop,resize.h+p.y-resize.y))+'px'});$('#handle').addEventListener('pointerup',()=>resize=false);$('#handle').addEventListener('pointercancel',()=>resize=false);
    $('#scan').onclick=async()=>{if(!source)return;const sx=canvas.width/wrap.clientWidth,sy=canvas.height/wrap.clientHeight,x=box.offsetLeft*sx,y=box.offsetTop*sy,w=box.offsetWidth*sx,h=box.offsetHeight*sy,tmp=document.createElement('canvas');tmp.width=Math.max(1,w*2);tmp.height=Math.max(1,h*2);const tc=tmp.getContext('2d');tc.filter='grayscale(1) contrast(1.9)';tc.drawImage(canvas,x,y,w,h,0,0,tmp.width,tmp.height);$('#progress').style.display='block';$('#scan').disabled=true;$('#left').disabled=$('#right').disabled=true;$('#last').style.display='none';try{const out=await Tesseract.recognize(tmp,'eng',{logger:m=>{if(m.progress!=null){const n=Math.round(m.progress*100);$('#bar').style.width=n+'%';$('#pct').textContent=n+'%';$('#status').textContent=m.status.replace(/(^\w| \w)/g,s=>s.toUpperCase())}}});const raw=out.data.text.trim().replace(/\s+/g,' '),clean=raw.toUpperCase().replace(/[^A-Z0-9]/g,''),labelCode=clean.match(/T?AA\d{7,10}/)?.[0],candidates=(raw.toUpperCase().match(/[A-Z0-9][A-Z0-9 -]{5,}/g)||[]).map(s=>s.replace(/[^A-Z0-9]/g,'')),code=labelCode||candidates.sort((a,b)=>b.length-a.length)[0]||clean;if(code.length<5){toast('No clear text found — adjust the box');return}items.push({code,time:new Intl.DateTimeFormat(undefined,{hour:'numeric',minute:'2-digit'}).format(new Date())});save();$('#lastCode').textContent=code;$('#last').style.display='block';toast('Added to list')}catch(err){toast('Scan failed — try again')}finally{$('#scan').disabled=false;$('#left').disabled=$('#right').disabled=false;setTimeout(()=>$('#progress').style.display='none',600)}};
  </script>
</body>
</html>
